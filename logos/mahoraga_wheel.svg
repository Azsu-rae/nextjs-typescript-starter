    <line x1="422" y1="258" x2="468" y2="212" stroke-width="5" opacity="0.9"/>
    <line x1="421" y1="260" x2="470" y2="210" stroke-width="2" opacity="0.4"/>
    <line x1="423" y1="340" x2="522" y2="340" stroke-width="5" opacity="0.9"/>
    <line x1="423" y1="338" x2="522" y2="342" stroke-width="2" opacity="0.4"/>
    <line x1="422" y1="422" x2="468" y2="468" stroke-width="5" opacity="0.9"/>
    <line x1="420" y1="420" x2="470" y2="470" stroke-width="2" opacity="0.4"/>
